[workspace]
resolver = "3"
members = ["crates/termlab-core", "crates/termlab-hook", "crates/termlabd", "crates/termlab-screen", "crates/termlab-server", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.18"
edition = "2024"
license = "FSL-1.1-ALv2"
rust-version = "1.93"

[workspace.lints.rust]
# "deny", not "forbid": the one exception is the macOS loader in the desktop app's
# station.rs, which calls WebKit directly and allows it right there.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
