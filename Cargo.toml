[workspace]
resolver = "3"
members = ["crates/termlab-core", "crates/termlab-hook", "crates/termlabd", "crates/termlab-server", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.6"
edition = "2024"
license = "FSL-1.1-ALv2"
rust-version = "1.93"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
