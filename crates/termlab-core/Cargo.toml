[package]
name = "termlab-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bytes = "1.12.1"
directories = "6.0.0"
portable-pty = "0.9.0"
regex = "1.13.1"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "net", "rt", "signal"] }
tracing = "0.1.44"
uuid = { version = "1.29", features = ["v4", "serde"] }
vt100 = "0.18.1"
which = "8.0.6"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
