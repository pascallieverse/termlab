name: Release

# Push a tag like v0.2.0 to build the installers into a draft release. Nothing is public
# until the draft is published on GitHub.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # "true" when the repository has the macOS signing secrets (see docs/releasing.md).
  MAC_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
  # "true" when it has Termlab's own self-signed certificate instead (see docs/releasing.md).
  MAC_SELF_SIGNING: ${{ secrets.MAC_SELF_SIGNED_CERTIFICATE != '' }}
  # "true" when the repository has the update signing key: the builds then update themselves.
  UPDATER: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
  BUILD_CONFIG: --config src-tauri/release.conf.json ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--config src-tauri/updater.conf.json' || '' }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  draft:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the version
        run: node apps/desktop/scripts/check-version.mjs "$GITHUB_REF_NAME"
      - name: Check the update key is in the app
        if: env.UPDATER == 'true'
        run: |
          node -e 'const c = require("./apps/desktop/src-tauri/updater.conf.json"); if (!c.plugins.updater.pubkey.trim()) { console.error("TAURI_SIGNING_PRIVATE_KEY is set, but updater.conf.json has no pubkey: see docs/releasing.md"); process.exit(1); }'
      # One draft, made before the builds start, so they don't each create their own.
      - name: Create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Termlab $GITHUB_REF_NAME" --generate-notes
          echo "id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon. Intel Macs are not supported.
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend packages
        working-directory: apps/desktop
        run: npm ci

      # Signed and notarized when the signing secrets are set.
      - name: Apple notarization key
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Build (macOS, signed)
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.draft.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ env.BUILD_CONFIG }} --target ${{ matrix.target }}

      # Without a Developer ID: Termlab's self-signed certificate. macOS keys an app's
      # permissions (Accessibility, Screen Recording) to its signature; with a certificate
      # they survive updates, while an ad hoc signature is new for every build.
      - name: Self-signed certificate (macOS)
        if: runner.os == 'macOS' && env.MAC_SIGNING != 'true' && env.MAC_SELF_SIGNING == 'true'
        env:
          CERTIFICATE: ${{ secrets.MAC_SELF_SIGNED_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_SELF_SIGNED_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/termlab-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # codesign only uses a certificate trusted for code signing.
          security find-certificate -c "Termlab Code Signing" -p "$keychain" > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          security find-identity -v -p codesigning "$keychain"
          echo "APPLE_SIGNING_IDENTITY=Termlab Code Signing" >> "$GITHUB_ENV"

      # Everything else. macOS with the self-signed certificate, or ad hoc without one: it
      # opens only after the user allows it in Privacy & Security.
      - name: Build
        if: runner.os != 'macOS' || env.MAC_SIGNING != 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.draft.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ env.BUILD_CONFIG }} --target ${{ matrix.target }}

      # Permissions only survive updates when macOS identifies the app by its certificate
      # (`certificate root = H"…"`: a self-signed certificate is its own root), not by the
      # build's hash (`cdhash H"…"`), as with ad hoc signing.
      - name: Check the signature (macOS)
        if: runner.os == 'macOS' && env.MAC_SIGNING != 'true' && env.MAC_SELF_SIGNING == 'true'
        run: |
          app="$(find target -maxdepth 6 -path '*/bundle/macos/Termlab.app' | head -n 1)"
          codesign --verify --deep --strict "$app"
          codesign -d -r - "$app" 2>&1 | tee "$RUNNER_TEMP/requirement.txt"
          grep -Eq 'certificate (root|leaf) = H' "$RUNNER_TEMP/requirement.txt"

  # termlab-server: static Linux binaries (x86-64 and arm64) for a VPS, attached to the
  # release, then packaged as a Docker image.
  server:
    needs: draft
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/server-web/package-lock.json
      - name: Web UI
        working-directory: apps/server-web
        run: |
          npm ci
          npm run build
      - name: Zig, for the musl cross builds
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild
      - name: Build
        run: |
          mkdir -p bin/data
          for pair in x86_64-unknown-linux-musl:amd64 aarch64-unknown-linux-musl:arm64; do
            target="${pair%%:*}"; arch="${pair##*:}"
            cargo zigbuild --release --locked -p termlab-server --target "$target"
            cp "target/$target/release/termlab-server" "termlab-server-$target"
            cp "target/$target/release/termlab-server" "bin/termlab-server-$arch"
          done
          sha256sum termlab-server-*-musl > termlab-server.sha256
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --clobber \
            termlab-server-x86_64-unknown-linux-musl termlab-server-aarch64-unknown-linux-musl termlab-server.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: server-bin
          path: bin
          include-hidden-files: true

  server-image:
    needs: server
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: server-bin
          path: bin
      - run: mkdir -p bin/data
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/termlab-server/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/termlab-server:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/termlab-server:latest
