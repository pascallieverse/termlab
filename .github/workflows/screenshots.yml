name: Screenshots

# Retakes the README screenshots (docs/screenshots/) whenever a release is published, so
# they always show the released version. They come from the UI running on its mocked
# daemon (apps/desktop/src/devMock.ts): sample data only, nothing from a real machine.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install
        working-directory: apps/desktop
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Take the screenshots
        working-directory: apps/desktop
        run: npm run screenshots

      - name: Commit them
        run: |
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update README screenshots for ${{ github.event.release.tag_name || 'main' }} [skip ci]"
          git pull --rebase
          git push

      - name: Attach them to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" docs/screenshots/*.png --clobber
