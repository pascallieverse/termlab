name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential patchelf

      # The rust-version from Cargo.toml, so clippy's lints match local checks. Newer stable
      # releases add lints; move this and rust-version together.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/server-web/package-lock.json

      # The app embeds the built frontend, so it comes before any cargo step.
      - name: Frontend
        working-directory: apps/desktop
        run: |
          npm ci
          node scripts/check-version.mjs
          npm run build

      # termlab-server embeds its web UI the same way.
      - name: Server web UI
        working-directory: apps/server-web
        run: |
          npm ci
          npm run build

      - name: Format
        if: runner.os == 'macOS'
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The tests drive fake agents written as shell scripts, which Windows can't run yet.
      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --workspace
      - name: Build the tests
        if: runner.os == 'Windows'
        run: cargo test --workspace --no-run
