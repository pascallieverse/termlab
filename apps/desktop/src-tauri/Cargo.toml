[package]
name = "termlab-desktop"
description = "Termlab desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "termlab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tempfile = "3.27.0"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# "unstable": child webviews (YouTube Music docked in the sidebar).
tauri = { version = "2.12", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
termlab-core = { path = "../../../crates/termlab-core" }
tokio = { version = "1.54.1", features = ["sync", "time", "macros", "rt", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tauri-plugin-updater = "2"

# Stations load their player page with an https base URL (see station.rs), which takes
# each platform's own web view API.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-app-kit", "WKWebView", "WKNavigation"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
