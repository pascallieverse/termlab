[package]
name = "termlab-desktop"
description = "Termlab desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "termlab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tempfile = "3.27.0"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# "unstable": child webviews (YouTube Music docked in the sidebar).
tauri = { version = "2.12", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
termlab-core = { path = "../../../crates/termlab-core" }
tokio = { version = "1.54.1", features = ["sync", "time", "macros", "rt", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
